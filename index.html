<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felipe´s Control - Inicio de Sesión</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">
        
        <div class="login-card">
            <!--<img src="img/felipeLogo1.png" class="marca-agua">-->
            <div class="logo">

                <img src="img/logo.png" alt="Logo Rotaract" class="logo-img">
                    <h1 class="logo-text">Felipe's Control</h1>
                

            </div>

            <div class="form-group">

                <label for="correo">
                    Correo Electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@gmail.com">

            </div>

            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingrese su contraseña">

            </div>

            <button
                id="btnLogin"
                class="btn-login">

                INICIAR SESIÓN

            </button>

            <div class="footer">

                <p>
                    &copy; 2026 Interact Club Cochabamba
                </p>

            </div>
                
        </div>

    </div>

    

    <script type="module" src="js/login.js"></script>

</body>

</html>
