<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar Pago</title>

    <link rel="stylesheet"
          href="css/formularios.css">

</head>

<body>

<div class="contenedor">

    <h1>

        Registrar Pago

    </h1>

    <form id="formPago">

        <label>Socio</label>

        <select id="socio" required>

            <option value="">
                Seleccione un socio
            </option>

        </select>

        <label>Monto (Bs.)</label>

        <input
            type="number"
            id="monto"
            min="0"
            step="0.01"
            required>

        <label>Mes que corresponde el pago</label>

        <input
            type="month"
            id="mesPago"
            required>

        <label>Fecha de pago</label>

        <input
            type="date"
            id="fechaPago"
            required>

        <label>Tipo de Pago</label>

        <select
            id="tipoPago"
            required>

            <option value="">
                Seleccione...
            </option>

            <option value="Efectivo">
                Efectivo
            </option>

            <option value="QR">
                QR
            </option>

        </select>

        <div
            id="contenedorQR"
            style="display:none; text-align:center;">

            <h3>

                Escanee el código QR

            </h3>

            <img
                src="img/qr.png"
                alt="QR"
                style="width:250px;">

        </div>

        <button type="submit">

            Registrar Pago

        </button>

    </form>

    <div class="botones">

        <button
            type="button"
            class="btnVolver"
            onclick="window.location.href='dashboard.html'">

            ← Volver

        </button>

    </div>

</div>

<script
    type="module"
    src="js/registrar-pago.js">

</script>

</body>

</html>
